[workspace]
channels = ["conda-forge"]
name = "mpas-analysis"
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
cartopy = ">=0.18.0"
cartopy_offlinedata = "*"
cmocean = "*"
dask = "*"
esmf = { version = ">=8.4.2,<9.0.0", build = "mpi_mpich_*" }
f90nml = "*"
geometric_features = ">=1.6.1"
gsw = "*"
lxml = "*"
mache = ">=1.11.0"
matplotlib-base = ">=3.9.0"
mpas_tools = ">=1.3.0,<2.0.0"
nco = ">=4.8.1,!=5.2.6,!=5.3.7"
netcdf4 = "*"
numpy = ">=2.0,<3.0"
pandas = "*"
pillow = ">=10.0.0,<13.0.0"
progressbar2 = "*"
pyproj = "*"
pyremap = ">=2.0.0,<3.0.0"
python-dateutil = "*"
requests = "*"
scipy = ">=1.7.0"
shapely = ">=2.0,<3.0"
tranche = ">=0.2.3"
xarray = ">=0.14.1"

[pypi-dependencies]
mpas-analysis = { path = ".", editable = true }

[feature.dev.dependencies]
pip = "*"
pytest = "*"
setuptools = ">=60"

[feature.docs.dependencies]
m2r2 = ">=0.3.3"
mistune = "<2"
mock = "*"
sphinx = "*"
sphinx_rtd_theme = "*"
tabulate = "*"

[feature.build.dependencies]
rattler-build = "*"

[feature.py310.dependencies]
python = "3.10.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["dev", "docs", "build"]
py310 = ["py310", "dev", "docs", "build"]
py311 = ["py311", "dev", "docs", "build"]
py312 = ["py312", "dev", "docs", "build"]
py313 = ["py313", "dev", "docs", "build"]
py314 = ["py314", "dev", "docs", "build"]
